# Netlify Configuration for Shree's Birthday Website

[build]
  publish = "."

# Optimized headers for MP3 audio streaming, fonts, and images
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "audio/mpeg"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA / Static Fallback Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
